[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-client"
version = "0.1.0"
description = "Preview asynchronous Python client for the Folio permission-aware RAG API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.8,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
folio_client = ["py.typed"]
