[project]
name = "folio-rag"
version = "0.1.0"
description = "Structure-aware document Q&A with Azure OpenAI and Qdrant"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20",
  "pydantic-settings>=2.8,<3",
  "openai>=2,<3",
  "qdrant-client>=1.15,<2",
  "docling>=2.50,<3",
  "tiktoken>=0.9,<1",
  "pyjwt>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "reportlab>=4,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
